name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install ".[dev,ml,llm]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantitext
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: quantitext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantitext"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://quantitext:testpassword@localhost:5432/quantitext_test
      DATABASE_URL_SYNC: postgresql+psycopg2://quantitext:testpassword@localhost:5432/quantitext_test
      DB_READONLY_URL: postgresql+asyncpg://quantitext:testpassword@localhost:5432/quantitext_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-do-not-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install ".[dev,ml,llm]"
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q

  stack-health-check:
    name: Stack Health Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        run: cp .env.example .env
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for backend /health
        run: |
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/health; then
              echo "Backend health check passed!"
              exit 0
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 2
          done
          echo "Health check timed out"
          docker compose logs backend
          exit 1
      - name: Teardown
        if: always()
        run: docker compose down -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t quantitext-backend ./backend

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npm run typecheck

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run tests
        run: npm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build
        run: npm run build
