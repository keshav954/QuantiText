[project]
name = "quantitext"
version = "0.1.0"
description = "AI-powered Business Intelligence and Decision Support System"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Pydantic
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    # Cache
    "redis>=5.0",
    # Auth
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    # HTTP client
    "httpx>=0.27",
    # File uploads
    "python-multipart>=0.0.9",
    # Data processing (used by upload_service for CSV/Excel onboarding)
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "anyio>=4.0",
]
ml = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "prophet>=1.1",
    "lightgbm>=4.4",
    "shap>=0.45",
    "mlflow>=2.16",
]
llm = [
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=0.2",
    "sqlglot>=25.0",
]
rag = [
    "sentence-transformers>=3.0",
    "pgvector>=0.3",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ─── Ruff ──────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends/Query pattern)
    "N806",  # variable in function should be lowercase (allow matrix X in ML algorithms)
    "N818",  # exception name should end in Error (allow AppException)
]

[tool.ruff.lint.per-file-ignores]
"ml/benchmark.py" = ["T201"]
"app/jobs/retrain.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ─── Pytest ────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
